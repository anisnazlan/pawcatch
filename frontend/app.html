<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2B22">
<title>WildWatch Elmina</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WildWatch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<style>
  /* ---------- Theme: Friendly Forest Edge ---------- */
  :root {
    --forest:#1D2B22; --bg:#F7F5EF; --card:#FFFFFF; --line:#E4E0D3; --muted:#4A5A51; --soft:#5A6A60;
    --leaf:#2E7A55; --leaf-soft:#8FC08D; --sage:#BFE0C2; --red:#C93A2E; --red-deep:#8E1F16; --red-soft:#FBE1DD;
    --monkey:#F6D77A; --dog:#BFD7F2; --snake:#BFE0C2; --boar:#F5C7A9; --lizard:#D6CCF2; --other:#F4C6D7;
    --head:'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif;
    --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#E9E6DC; }
  body { font-family:var(--body); color:var(--forest); }
  button { font-family:inherit; color:inherit; }
  a { color:var(--forest); }
  .app { max-width:480px; min-height:100dvh; margin:0 auto; background:var(--bg); position:relative; overflow-x:hidden; }
  .screen { display:none; min-height:100dvh; padding-bottom:120px; }
  .screen.active { display:block; }
  .screen.no-nav { padding-bottom:28px; }
  .pad { padding:0 20px; }
  .hidden { display:none !important; }
  h1, h2, h3 { font-family:var(--head); margin:0; }
  .eyebrow { margin:0; font-size:12px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; }
  .muted { color:var(--muted); }

  /* ---------- Motion ---------- */
  @keyframes enterUp { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:none; } }
  @keyframes enterRight { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:none; } }
  @keyframes enterLeft { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes rise { from { opacity:0; transform:translateY(16px) scale(.98); } to { opacity:1; transform:none; } }
  @keyframes pop { 0% { transform:scale(.4); opacity:0; } 70% { transform:scale(1.12); opacity:1; } 100% { transform:scale(1); } }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(201,58,46,.55); } 70% { box-shadow:0 0 0 16px rgba(201,58,46,0); } 100% { box-shadow:0 0 0 0 rgba(201,58,46,0); } }
  @keyframes scan { 0% { top:12%; } 50% { top:82%; } 100% { top:12%; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  .screen.active.in-up { animation:enterUp .42s var(--ease); }
  .screen.active.in-right { animation:enterRight .38s var(--ease); }
  .screen.active.in-left { animation:enterLeft .38s var(--ease); }
  .screen.active.in-fade { animation:fadeIn .3s ease; }
  .stagger > * { animation:rise .5s var(--ease) both; animation-delay:calc(var(--i, 0) * 70ms + 80ms); }
  .press { transition:transform .12s ease, filter .12s ease; }
  .press:active { transform:scale(.95); filter:brightness(.95); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important; }
  }

  /* ---------- Shared pieces ---------- */
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:58px; border:none; border-radius:29px; background:var(--forest); color:var(--bg); font-weight:700; font-size:17px; text-decoration:none; cursor:pointer; }
  .btn:disabled { opacity:.55; }
  .btn.ghost { background:transparent; color:var(--forest); border:2px solid var(--forest); }
  .btn.red { background:var(--red); color:#fff; }
  .btn.red.big { height:66px; font-size:18px; animation:pulse 1.6s infinite; }
  .btn-outline-red { display:flex; align-items:center; justify-content:center; gap:8px; height:50px; border-radius:25px; border:2px solid var(--red); color:#B3271C; text-decoration:none; font-weight:700; font-size:15px; }
  .round { width:44px; height:44px; border-radius:22px; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .chip { border:1.5px solid #DCD8CC; background:#fff; border-radius:18px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; transition:background .18s, color .18s, transform .12s, border-color .18s; }
  .chip.on { background:var(--forest); color:var(--bg); border-color:var(--forest); }
  .chip:active { transform:scale(.94); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .card { background:var(--card); border:1.5px solid var(--line); border-radius:24px; padding:16px; }
  .err { color:var(--red); font-size:14px; font-weight:600; min-height:1.2em; margin:8px 0 0; }
  .spinner { width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(247,245,239,.35); border-top-color:#F7F5EF; animation:spin .8s linear infinite; }

  /* ---------- Welcome ---------- */
  .welcome-art { height:420px; position:relative; overflow:hidden; }
  .welcome-art svg.scene { position:absolute; inset:0; width:100%; height:100%; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-mark { width:40px; height:40px; border-radius:14px; background:var(--forest); display:flex; align-items:center; justify-content:center; }
  .sun { animation:float 4s ease-in-out infinite; transform-origin:center; }

  /* ---------- Home ---------- */
  .top { display:flex; align-items:center; gap:8px; padding:calc(16px + env(safe-area-inset-top)) 20px 8px; }
  .call-pill { height:44px; padding:0 14px; border-radius:22px; background:var(--red); color:#fff; text-decoration:none; display:flex; align-items:center; gap:6px; font-family:var(--head); font-weight:800; font-size:17px; }
  .hero { background:var(--monkey); border-radius:32px; padding:22px; position:relative; overflow:hidden; min-height:196px; }
  .hero .ring-bg { position:absolute; right:-24px; top:-20px; }
  .hero h1 { font-weight:800; font-size:34px; line-height:1; letter-spacing:-.8px; width:220px; position:relative; margin-top:6px; }
  .hero p { margin:6px 0 0; font-size:15px; line-height:1.4; color:#3D3A22; width:200px; position:relative; }
  .cam { position:absolute; right:18px; bottom:18px; width:78px; height:78px; border-radius:39px; border:none; background:var(--forest); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(29,43,34,.25); cursor:pointer; }
  .cam::after { content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid rgba(29,43,34,.25); animation:pulse 2.4s infinite; box-shadow:none; }
  .linkish { background:none; border:none; padding:0; font-size:14px; font-weight:700; text-decoration:underline; cursor:pointer; position:relative; }
  .near { background:var(--lizard); border-radius:26px; padding:16px 18px; display:flex; gap:14px; align-items:center; }
  .near .ico { width:48px; height:48px; flex-shrink:0; border-radius:16px; background:var(--forest); display:flex; align-items:center; justify-content:center; }
  .grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
  .tile { border:none; border-radius:20px; padding:12px; height:78px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; text-align:left; cursor:pointer; }
  .tile b { font-size:14px; } .tile span { font-size:12px; color:#3C4A41; }
  .section-head { display:flex; align-items:baseline; justify-content:space-between; margin:4px 0 10px; }
  .section-head h2 { font-weight:700; font-size:20px; }

  /* ---------- Bottom bar ---------- */
  .nav { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); width:min(448px, calc(100% - 32px)); height:72px; border-radius:36px; background:var(--forest); display:flex; align-items:center; justify-content:space-around; padding:0 8px; z-index:50; box-shadow:0 10px 28px rgba(29,43,34,.28); }
  .nav button { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:#C9DBD0; font-size:11px; font-weight:700; white-space:nowrap; cursor:pointer; width:68px; padding:6px 0; border-radius:20px; transition:color .2s, background .2s; }
  .nav button.on { color:var(--forest); background:var(--monkey); }
  .nav .plus { width:58px; height:58px; border-radius:29px; background:var(--leaf-soft); color:var(--forest); justify-content:center; margin-top:-26px; box-shadow:0 8px 18px rgba(0,0,0,.25); border:4px solid var(--bg); }
  .nav .plus span { display:none; }

  /* ---------- Report (photo + AI result) ---------- */
  .photo-wrap { position:relative; height:340px; background:#7FB38A; overflow:hidden; }
  .photo-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .scanline { position:absolute; left:8%; right:8%; height:3px; border-radius:2px; background:var(--monkey); box-shadow:0 0 14px 4px rgba(246,215,122,.7); animation:scan 1.6s ease-in-out infinite; }
  .frame { position:absolute; inset:46px 40px; pointer-events:none; }
  .frame i { position:absolute; width:28px; height:28px; border:4px solid #F7F5EF; }
  .frame i:nth-child(1) { left:0; top:0; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .frame i:nth-child(2) { right:0; top:0; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .frame i:nth-child(3) { left:0; bottom:0; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .frame i:nth-child(4) { right:0; bottom:0; border-left:none; border-top:none; border-radius:0 0 8px 0; }
  .photo-top { position:absolute; left:20px; right:20px; top:calc(16px + env(safe-area-inset-top)); display:flex; justify-content:space-between; }
  .glass { background:rgba(247,245,239,.92); }
  .sheet { position:relative; margin-top:-40px; background:var(--bg); border-radius:36px 36px 0 0; padding:22px 20px 0; display:flex; flex-direction:column; gap:18px; }
  .ai-badge { align-self:flex-start; padding:4px 10px; border-radius:10px; background:var(--forest); color:var(--monkey); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .ring { position:relative; width:76px; height:76px; flex-shrink:0; }
  .ring circle.val { transition:stroke-dashoffset 1s var(--ease), stroke .3s; }
  .ring .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .num b { font-family:var(--head); font-weight:800; font-size:18px; line-height:1; }
  .ring .num span { font-size:10px; color:var(--muted); }
  .animal-chip { border:2px solid transparent; border-radius:16px; padding:9px 12px; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; transition:transform .12s, border-color .18s; }
  .animal-chip.on { border-color:var(--forest); }
  .animal-chip.on::before { content:""; width:8px; height:8px; border-radius:4px; background:var(--forest); }
  .loc { display:flex; align-items:center; gap:12px; }
  .loc .ico { width:42px; height:42px; border-radius:14px; background:var(--monkey); display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ---------- Sent / track ---------- */
  .done-head { background:var(--sage); border-radius:0 0 36px 36px; padding:calc(16px + env(safe-area-inset-top)) 20px 24px; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px; }
  .done-head .tick { position:absolute; right:-36px; top:16px; animation:pop .7s var(--ease) .15s both; }
  .done-head .tick path { stroke-dasharray:110; stroke-dashoffset:110; animation:draw .7s ease .55s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .badge { padding:6px 12px; border-radius:12px; font-size:13px; font-weight:700; }
  .u-high { background:var(--red); color:#fff; } .u-medium { background:var(--monkey); } .u-low { background:#F7F5EF; }
  .timeline { list-style:none; margin:0; padding:0; }
  .timeline li { display:flex; gap:14px; }
  .timeline .rail { display:flex; flex-direction:column; align-items:center; width:24px; }
  .timeline .dot { width:22px; height:22px; border-radius:11px; border:3px solid #C9C4B5; background:#fff; animation:pop .45s var(--ease) both; }
  .timeline .bar { width:3px; flex-grow:1; min-height:18px; background:var(--line); }
  .timeline li.done .dot { background:var(--leaf); border-color:var(--leaf); }
  .timeline li.done .bar { background:var(--leaf); }
  .timeline li.now .dot { background:var(--monkey); border-color:var(--forest); }
  .timeline li:last-child .bar { background:transparent; }
  .timeline .txt { display:flex; flex-direction:column; padding-bottom:14px; }
  .timeline .txt b { font-size:15px; } .timeline .txt span { font-size:13px; color:var(--soft); }
  .tipcard { border-radius:20px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .tipcard b { font-family:var(--head); font-weight:800; font-size:22px; }
  .tipcard span { font-size:13px; line-height:1.35; font-weight:500; }

  /* ---------- My reports ---------- */
  .page-head { padding:calc(20px + env(safe-area-inset-top)) 20px 14px; display:flex; flex-direction:column; gap:4px; }
  .page-head h1 { font-weight:800; font-size:32px; letter-spacing:-.6px; }
  .rep { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:22px; padding:12px 14px; cursor:pointer; }
  .rep .sw { width:46px; height:46px; border-radius:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:800; font-size:15px; }
  .pill { padding:5px 10px; border-radius:10px; font-size:12px; font-weight:700; white-space:nowrap; }
  .st-received, .st-assigned { background:#F7F5EF; border:1.5px solid #C9C4B5; }
  .st-in_progress { background:var(--monkey); }
  .st-resolved { background:var(--sage); }
  .empty { text-align:center; padding:28px 16px; }
  input[type=text], input[type=number] { width:100%; height:52px; padding:0 16px; border:1.5px solid #DCD8CC; border-radius:18px; font-size:16px; font-family:inherit; background:#fff; }
  .lbl { font-size:14px; font-weight:700; display:block; margin:0 0 8px; }

  /* ---------- Map ---------- */
  .map-box { height:calc(100dvh - 300px); min-height:340px; border-radius:28px; overflow:hidden; border:1.5px solid var(--line); }
  .legend { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .legend::-webkit-scrollbar { display:none; }
  .legend .chip { white-space:nowrap; padding:8px 12px; }
  .legend .chip i { display:inline-block; width:10px; height:10px; border-radius:5px; margin-right:6px; vertical-align:middle; }

  /* ---------- Tips ---------- */
  .tip-row { display:flex; gap:14px; align-items:flex-start; background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:14px 16px; }
  .tip-row .n { width:34px; height:34px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:800; }

  /* ---------- Location picker sheet ---------- */
  .overlay { position:fixed; inset:0; background:rgba(29,43,34,.45); z-index:80; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease; }
  .overlay .panel { width:100%; max-width:480px; background:var(--bg); border-radius:32px 32px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; animation:enterUp .35s var(--ease); }
  #pickMap { height:52vh; border-radius:22px; }

  .install { display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:10px 12px; font-size:13px; }
  .noServer { background:#fdf1e6; color:#7a3a10; padding:12px 16px; font-size:14px; line-height:1.5; }
  /* ---------- Language switch ---------- */
  .lang-seg { display:flex; background:rgba(29,43,34,.08); border-radius:16px; padding:3px; gap:2px; }
  .lang-seg button { border:none; background:none; padding:7px 11px; border-radius:13px; font-size:13px; font-weight:700; cursor:pointer; color:var(--forest); }
  .lang-seg button.on { background:var(--forest); color:var(--bg); }
  .lang-pill { height:44px; min-width:48px; padding:0 10px; border-radius:22px; border:1.5px solid #DCD8CC; background:#fff; display:flex; align-items:center; justify-content:center; gap:5px; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .w-head { position:absolute; top:calc(28px + env(safe-area-inset-top)); left:24px; right:20px; display:flex; align-items:center; justify-content:space-between; }
  .em { font-style:italic; font-weight:600; color:var(--leaf); }
</style>
</head>
<body>
<div class="app" id="app">
<div class="noServer hidden" id="noServer" data-t-html="no_server"></div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<!-- ======================= WELCOME (first visit only) ======================= -->
<section class="screen no-nav" id="s-welcome">
  <div class="welcome-art">
    <svg class="scene" viewBox="0 0 390 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle class="sun" cx="300" cy="110" r="54" fill="#F6D77A"></circle>
      <path d="M0 250 C 80 170, 160 190, 230 230 S 360 200, 390 170 L 390 420 L 0 420 Z" fill="#8FC08D"></path>
      <path d="M0 300 C 90 250, 170 270, 250 300 S 360 280, 390 260 L 390 420 L 0 420 Z" fill="#5E9E6E"></path>
      <rect x="196" y="282" width="70" height="60" rx="6" fill="#F7F5EF"></rect>
      <path d="M188 286 L231 248 L274 286 Z" fill="#E7855E"></path>
      <rect x="222" y="306" width="18" height="36" rx="3" fill="#BFD7F2"></rect>
      <rect x="290" y="300" width="56" height="44" rx="6" fill="#F7F5EF"></rect>
      <path d="M283 304 L318 274 L353 304 Z" fill="#E7855E"></path>
      <rect x="60" y="216" width="10" height="70" rx="5" fill="#3E6B4C"></rect>
      <circle cx="65" cy="200" r="34" fill="#3E7A52"></circle>
      <circle cx="44" cy="222" r="22" fill="#3E7A52"></circle>
      <circle cx="122" cy="246" r="20" fill="#C98B5B"></circle>
      <circle cx="122" cy="226" r="13" fill="#C98B5B"></circle>
      <circle cx="117" cy="223" r="2.5" fill="#1D2B22"></circle>
      <circle cx="127" cy="223" r="2.5" fill="#1D2B22"></circle>
      <path d="M140 252 C 160 250, 162 230, 150 222" stroke="#C98B5B" stroke-width="5" fill="none" stroke-linecap="round"></path>
      <path d="M0 360 C 100 340, 200 350, 390 330 L 390 420 L 0 420 Z" fill="#F7F5EF"></path>
    </svg>
    <div class="w-head">
      <div class="logo">
        <div class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6D77A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="15" r="4"/><circle cx="6" cy="9" r="2"/><circle cx="10" cy="5" r="2"/><circle cx="14" cy="5" r="2"/><circle cx="18" cy="9" r="2"/></svg></div>
        <span style="font-family:var(--head);font-weight:800;font-size:20px">WildWatch</span>
      </div>
      <div class="lang-seg" role="group" aria-label="Language / Bahasa"><button data-lang="en">EN</button><button data-lang="ms">BM</button></div>
    </div>
  </div>
  <div class="pad stagger" style="display:flex;flex-direction:column;gap:16px">
    <p class="eyebrow" style="color:var(--leaf)" data-t="w_city"></p>
    <h1 style="font-weight:800;font-size:42px;line-height:1.04;letter-spacing:-1px" data-t-html="w_title"></h1>
    <p style="margin:0;font-size:16px;line-height:1.5;color:var(--muted)" data-t="w_body"></p>
    <p style="margin:0;font-size:13px;color:var(--soft)" data-t="w_loc"></p>
    <button class="btn press" id="startBtn" style="justify-content:space-between;padding:0 8px 0 24px"><span data-t="w_start"></span><span style="width:44px;height:44px;border-radius:22px;background:var(--monkey);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
    <a class="btn-outline-red press" href="tel:999"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3271C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span data-t="call_danger"></span></a>
  </div>
</section>

<!-- ======================= HOME ======================= -->
<section class="screen" id="s-home">

/* ---------- Sounds (made in code, no files) ---------- */
const Sound = (() => {
  let ctx = null;
  function ac() {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    } catch { return null; }
  }
  function tone(freq, start, dur, type, vol) {
    const c = ac(); if (!c) return;
    const tt = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, tt);
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(vol, tt + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(g); g.connect(c.destination); o.start(tt); o.stop(tt + dur + 0.03);
  }
  function noise(len, from, to, vol) {
    const c = ac(); if (!c) return;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = "bandpass"; f.Q.value = 1.1;
    f.frequency.setValueAtTime(from, c.currentTime); f.frequency.exponentialRampToValueAtTime(to, c.currentTime + len);
    g.gain.value = vol; src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  }
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
  return {
    tap()   { tone(1150, 0, 0.05, "triangle", 0.045); buzz(8); },
    swipe() { noise(0.26, 500, 2600, 0.09); },
    pop()   { tone(660, 0, 0.09, "sine", 0.07); tone(990, 0.07, 0.12, "sine", 0.06); },
    send()  { noise(0.38, 300, 3400, 0.12); },
    done()  { tone(784, 0, 0.2, "sine", 0.08); tone(1046.5, 0.13, 0.24, "sine", 0.08); tone(1318.5, 0.26, 0.4, "sine", 0.07); buzz([12, 50, 20]); },
    error() { tone(330, 0, 0.14, "square", 0.035); tone(247, 0.12, 0.2, "square", 0.035); buzz(60); }
  };
})();
document.addEventListener("click", e => { if (e.target.closest("button, a, .tile")) Sound.tap(); }, true);

/* ---------- Screens and transitions ---------- */
const ORDER = ["home", "map", "reports", "tips"];
const NAV_SCREENS = new Set(ORDER);
let current = null;
function show(name, how) {
  const next = $("s-" + name); if (!next) return;
  let anim = how;
  if (!anim && current && ORDER.includes(current) && ORDER.includes(name)) anim = ORDER.indexOf(name) > ORDER.indexOf(current) ? "in-right" : "in-left";
  document.querySelectorAll(".screen.active").forEach(s => s.classList.remove("active", "in-up", "in-right", "in-left", "in-fade"));
  next.classList.add("active", anim || "in-up");
  restagger(next);
  $("nav").classList.toggle("hidden", !NAV_SCREENS.has(name));
  document.querySelectorAll("#nav [data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === name));
  if (current && current !== name) Sound.swipe();
  current = name;
  window.scrollTo(0, 0);
  if (name === "home") renderHome();
  if (name === "reports") renderReports();
  if (name === "map") openMap();
  if (name === "tips") renderTips(tipAnimal);
}
function restagger(root) {
  root.querySelectorAll(".stagger").forEach(box => {
    [...box.children].forEach((c, i) => { if (!c.style.getPropertyValue("--i")) c.style.setProperty("--i", i); c.style.animation = "none"; void c.offsetWidth; c.style.animation = ""; });
  });
}

/* ---------- Location ---------- */
const here = { lat: null, lng: null, acc: null };
function locate(onDone) {
  if (!navigator.geolocation) { onDone && onDone(false); return; }
  navigator.geolocation.getCurrentPosition(p => {
    here.lat = p.coords.latitude; here.lng = p.coords.longitude; here.acc = p.coords.accuracy;
    store.set("ww_loc", true);
    $("locStatus").textContent = t("loc_on");
    onDone && onDone(true);
  }, () => { $("locStatus").textContent = t("loc_off"); onDone && onDone(false); },
  { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
$("locStatus").onclick = () => locate(ok => { if (ok) renderNear(); });
function distKm(a, b, c, d) { const r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * 6371; }

/* ---------- Home ---------- */
function greeting() { const h = new Date().getHours(); return t(h < 12 ? "greet_morning" : h < 19 ? "greet_afternoon" : "greet_evening"); }
function renderHome() {
  $("greet").textContent = greeting();
  const tiles = $("animalTiles");
  if (!tiles.children.length) {
    for (const k of Object.keys(ANIMALS)) {
      const a = ANIMALS[k], tx = ANIMAL_TEXT[lang][k];
      const b = document.createElement("button");
      b.className = "tile press"; b.style.background = a.bg;
      b.innerHTML = "<b>" + esc(tx.name) + "</b><span>" + esc(tx.hint) + "</span>";
      b.onclick = () => { tipAnimal = k; show("tips", "in-up"); };
      tiles.appendChild(b);
    }
  }
  renderNear();
}
let sightings7 = null;
async function renderNear() {
  if (!sightings7) $("nearTitle").textContent = t("near_loading");
  try {
    if (!sightings7) { const r = await fetch("/api/public/sightings?days=7"); if (!r.ok) throw 0; sightings7 = await r.json(); }
    let list = sightings7, where = t("where_elmina");
    if (here.lat !== null) { list = sightings7.filter(s => distKm(here.lat, here.lng, s.lat, s.lng) <= 1.5); where = t("where_near"); }
    if (!list.length) { $("nearTitle").textContent = t("near_quiet", { where }); $("nearTip").textContent = t("near_quiet_sub"); return; }
    const count = {}; list.forEach(s => count[s.animal] = (count[s.animal] || 0) + 1);
    const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
    $("nearTitle").textContent = t(top[1] === 1 ? "near_once" : "near_count", { animal: aName(top[0]), n: top[1], where });
    $("nearTip").textContent = NEAR_TIP[lang][top[0]] || NEAR_TIP[lang].other;
  } catch { $("nearTitle").textContent = t("near_fallback"); $("nearTip").textContent = t("near_fallback_sub"); }
}

function incidentChips() {
  const box = $("incidentChips"); box.innerHTML = "";
  for (const k of Object.keys(INCIDENTS.en)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (report.incident === k ? " on" : "");
    b.textContent = incName(k); b.setAttribute("aria-pressed", report.incident === k);
    b.onclick = () => { report.incident = k; incidentChips(); $("sendErr").textContent = ""; };
    box.appendChild(b);
  }
}
function setRing(conf, ok) {
  const v = $("ringVal"), c = 175.9;
  v.style.stroke = ok ? "#2E7A55" : "#E2B93B";
  v.style.strokeDashoffset = c;
  requestAnimationFrame(() => requestAnimationFrame(() => { v.style.strokeDashoffset = c * (1 - Math.max(0, Math.min(1, conf))); }));
  const target = Math.round(conf * 100); let n = 0;
  const step = () => { n = Math.min(target, n + Math.max(1, Math.round(target / 18))); $("ringNum").textContent = n + "%"; if (n < target) requestAnimationFrame(step); };
  step();
}
/* Shows the AI's answer in the current language */
function renderAI() {
  const s = aiState, nm = s.animal ? aName(s.animal) : "";
  const set = (badge, title, note) => { $("aiBadge").textContent = badge; $("aiAnimal").textContent = title; $("aiNote").textContent = note; };
  if (s.kind === "loading") set(t("ai_looking"), t("identifying"), t("hold_on"));
  else if (s.kind === "sure") set(t("ai_detected"), nm, t("not_right"));
  else if (s.kind === "unsure") set(t("not_sure"), nm, s.animal === "other" ? t("maybe_other") : t("maybe", { animal: lang === "en" ? nm.toLowerCase() : nm.toLowerCase() }));
  else if (s.kind === "nomodel") set(t("pick_animal"), t("which_one"), t("ai_unavail"));
  else if (s.kind === "offline") set(t("offline"), t("which_one"), t("ai_unreach"));
}
async function startResult(file) {
  animalChips(); incidentChips();
  $("ringVal").style.strokeDashoffset = 175.9; $("ringNum").textContent = "–";
  if (file) {
    $("photoPreview").src = URL.createObjectURL(file);
    $("photoPreview").classList.remove("hidden"); $("photoPlaceholder").classList.add("hidden");
    $("retakeBtn").textContent = t("retake");
    $("aiRow").classList.remove("hidden");
    aiState = { kind: "loading", animal: null }; renderAI();
    $("scanline").classList.remove("hidden");
  } else {
    aiState = { kind: "nophoto", animal: null };
    $("photoPreview").classList.add("hidden"); $("photoPlaceholder").classList.remove("hidden");
    $("retakeBtn").textContent = t("add_photo");
    $("aiRow").classList.add("hidden"); $("scanline").classList.add("hidden");
  }
  show("result", "in-up");
  fillLocation();
  if (!file) return;
  const fd = new FormData(); fd.append("photo", file);
  try {
    const res = await fetch("/api/classify", { method: "POST", body: fd });
    if (!res.ok) throw 0;
    const r = await res.json();
    report.photo = r.photo; report.confidence = r.confidence; report.ai_mode = r.mode;
    $("scanline").classList.add("hidden");
    if (r.animal && ANIMALS[r.animal]) {
      if (r.confident) report.animal = r.animal;
      aiState = { kind: r.confident ? "sure" : "unsure", animal: r.animal };
      setRing(r.confidence || 0, !!r.confident); Sound.pop();
    } else { aiState = { kind: "nomodel", animal: null }; setRing(0, false); }
  } catch {
    $("scanline").classList.add("hidden");
    aiState = { kind: "offline", animal: null }; setRing(0, false);
  }
  renderAI(); animalChips();
}
function renderLoc() {
  if (locState === "finding") { $("locTitle").textContent = t("loc_finding"); $("locSub").textContent = t("loc_gps"); }
  else if (locState === "gps") { $("locTitle").textContent = t("loc_current"); $("locSub").textContent = t("loc_acc", { m: Math.max(5, Math.round(here.acc || 0)) }); }
  else if (locState === "off") { $("locTitle").textContent = t("loc_off_title"); $("locSub").textContent = t("loc_off_sub"); }
  else if (locState === "pin") { $("locTitle").textContent = t("pin_placed"); $("locSub").textContent = report.lat.toFixed(5) + ", " + report.lng.toFixed(5); }
}
function fillLocation() {
  if (report.placed) return;
  locState = "finding"; renderLoc();
  locate(ok => {
    if (report.placed) return;
    if (ok) { report.lat = here.lat; report.lng = here.lng; locState = "gps"; } else locState = "off";
    renderLoc();
  });
}

/* Location picker */
let pickMap = null, pickPin = null, pickLatLng = null;
$("changeLoc").onclick = () => {
  $("pickSheet").classList.remove("hidden");
  const start = report.lat !== null ? [report.lat, report.lng] : ELMINA;
  if (!pickMap) {
    pickMap = L.map("pickMap", { zoomControl: false }).setView(start, 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(pickMap);
    pickMap.on("click", e => { pickLatLng = e.latlng; pickPin.setLatLng(e.latlng); Sound.tap(); });
    pickPin = L.circleMarker(start, { radius: 11, color: "#1D2B22", weight: 3, fillColor: "#F6D77A", fillOpacity: 1 }).addTo(pickMap);
  } else { pickMap.setView(start, 16); pickPin.setLatLng(start); }
  pickLatLng = L.latLng(start[0], start[1]);
  setTimeout(() => pickMap.invalidateSize(), 120);
};
$("pickCancel").onclick = () => $("pickSheet").classList.add("hidden");
$("pickOk").onclick = () => {
  report.lat = pickLatLng.lat; report.lng = pickLatLng.lng; report.placed = true;
  locState = "pin"; renderLoc();
  $("pickSheet").classList.add("hidden");
};

/* Send */
const SEND_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6D77A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>';
let sending = false;
function setSendLabel() { $("sendBtn").innerHTML = sending ? '<span class="spinner"></span>' + esc(t("sending")) : esc(t("send")) + SEND_ICON; }
$("sendBtn").onclick = async () => {
  const err = $("sendErr");
  if (!report.animal) { Sound.error(); return err.textContent = t("err_animal"); }
  if (!report.incident) { Sound.error(); return err.textContent = t("err_incident"); }
  if (report.lat === null) { Sound.error(); return err.textContent = t("err_loc"); }
  const btn = $("sendBtn"); btn.disabled = true; sending = true; setSendLabel();
  Sound.send();
  const fd = new FormData();
  for (const k of ["lat", "lng", "animal", "incident", "photo", "confidence", "ai_mode"]) if (report[k] !== null && report[k] !== undefined) fd.append(k, report[k]);
  try {
    const res = await fetch("/api/reports", { method: "POST", body: fd });
    if (!res.ok) throw 0;
    const r = await res.json();
    const mine = store.get("ww_reports", []);
    if (!mine.includes(r.id)) mine.unshift(r.id);
    store.set("ww_reports", mine.slice(0, 50));
    renderStatus({ id: r.id, animal: report.animal, incident: report.incident, urgency: r.urgency, agency: r.agency, status: r.status }, true);
    show("sent", "in-up");
    setTimeout(() => Sound.done(), 250);
  } catch {
    Sound.error(); err.textContent = t("err_send");
  } finally {
    btn.disabled = false; sending = false; setSendLabel();
  }
};

/* ---------- Status screen (just sent, or tracking) ---------- */
let lastStatus = null;
function renderStatus(r, fresh) {
  lastStatus = { r, fresh };
  const idx = Math.max(0, STEP_KEYS.indexOf(r.status));
  $("sentId").textContent = t(fresh ? "report_sent" : "report_n", { id: r.id });
  $("sentTitle").textContent = fresh ? t("t_fresh") : r.status === "resolved" ? t("t_resolved") : r.status === "in_progress" ? t("t_progress") : t("t_arranged");
  const u = $("sentUrg"); u.className = "badge u-" + r.urgency; u.textContent = t("urg_" + r.urgency);
  $("sentWhat").textContent = aName(r.animal) + " · " + incName(r.incident);
  $("sentAgency").textContent = agencyName(r.agency);
  $("timeline").innerHTML = STEP_KEYS.map((k, i) => {
    const cls = i < idx || (i === idx && k === "resolved") ? "done" : i === idx ? "now" : "";
    const sub = i === 0 && r.created_at ? fmtDate(r.created_at) : t("st_" + k + "_sub");
    return '<li class="' + cls + '"><div class="rail"><span class="dot" style="animation-delay:' + (i * 140 + 200) + 'ms"></span><span class="bar"></span></div><div class="txt"><b>' + esc(t("st_" + k)) + "</b><span>" + esc(sub) + "</span></div></li>";
  }).join("");
  const tips = (TIPS[lang][r.animal] || TIPS[lang].other).slice(0, 3);
  $("sentTips").innerHTML = tips.map((tip, i) => '<div class="tipcard" style="background:' + TIP_COLORS[i % 3] + '"><b>' + (i + 1) + "</b><span>" + esc(tip) + "</span></div>").join("");
  $("sentCall").classList.toggle("big", r.urgency === "high");
}

/* ---------- My reports ---------- */
async function renderReports() {
  const box = $("repList"), ids = store.get("ww_reports", []);
  if (!ids.length) {
    box.innerHTML = '<div class="card empty"><h2 style="font-weight:700;font-size:20px;margin-bottom:6px">' + esc(t("no_reports")) + '</h2><p class="muted" style="margin:0 0 14px;font-size:14px">' + esc(t("no_reports_sub")) + '</p><button class="btn press" id="firstReport">' + esc(t("report_animal")) + "</button></div>";
    $("firstReport").onclick = () => $("photoInput").click();
    return;
  }
  box.innerHTML = ids.map(() => '<div class="rep" style="height:74px;opacity:.5"></div>').join("");
  const rows = await Promise.all(ids.map(id => fetch("/api/reports/" + id).then(r => r.ok ? r.json() : null).catch(() => null)));
  box.innerHTML = "";
  rows.forEach((r, i) => {
    if (!r) return;
    const a = ANIMALS[r.animal] || ANIMALS.other;
    const b = document.createElement("button");
    b.className = "rep press"; b.style.setProperty("--i", i);
    b.innerHTML = '<span class="sw" style="background:' + a.bg + '">#' + esc(r.id) + "</span>" +
      '<span style="flex-grow:1;display:flex;flex-direction:column;gap:3px;min-width:0"><b style="font-size:15px">' + esc(aName(r.animal)) + " · " + esc(incName(r.incident)) + '</b><span style="font-size:12px;color:var(--soft)">' + esc(fmtDate(r.created_at)) + "</span>" +
      '<span class="pill st-' + esc(r.status) + '" style="align-self:flex-start">' + esc(t("st_" + r.status)) + "</span></span>" +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    b.onclick = () => { renderStatus(r, false); show("sent", "in-right"); };
    box.appendChild(b);
  });
  if (!box.children.length) box.innerHTML = '<div class="card empty"><p class="muted" style="margin:0">' + esc(t("load_fail")) + "</p></div>";
  restagger($("s-reports"));
}
$("trackBtn").onclick = async () => {
  const id = $("trackId").value.trim(), err = $("trackErr"); err.textContent = "";
  if (!id) { Sound.error(); return err.textContent = t("err_enter"); }
  try {
    const res = await fetch("/api/reports/" + encodeURIComponent(id));
    if (!res.ok) throw 0;
    const r = await res.json(); renderStatus(r, false); show("sent", "in-right");
  } catch { Sound.error(); err.textContent = t("err_notfound"); }
};

/* ---------- Map ---------- */
let map = null, layer = null, mapData = null, mapFilter = "all", youDot = null;
function buildLegend() {
  const leg = $("legend"); leg.innerHTML = "";
  const all = document.createElement("button"); all.className = "chip" + (mapFilter === "all" ? " on" : ""); all.textContent = t("all"); all.dataset.k = "all"; leg.appendChild(all);
  for (const k of Object.keys(ANIMALS)) {
    const b = document.createElement("button"); b.className = "chip" + (mapFilter === k ? " on" : ""); b.dataset.k = k;
    b.innerHTML = '<i style="background:' + ANIMALS[k].deep + '"></i>' + esc(aName(k)); leg.appendChild(b);
  }
}
$("legend").onclick = e => { const b = e.target.closest("button"); if (!b) return; mapFilter = b.dataset.k; $("legend").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); drawMap(); };
async function openMap() {
  if (!map) {
    map = L.map("map").setView(here.lat !== null ? [here.lat, here.lng] : ELMINA, 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  if (!$("legend").children.length) buildLegend();
  setTimeout(() => map.invalidateSize(), 80);
  if (here.lat !== null && !youDot) youDot = L.circleMarker([here.lat, here.lng], { radius: 8, color: "#fff", weight: 3, fillColor: "#1D2B22", fillOpacity: 1 }).addTo(map);
  if (youDot) youDot.bindTooltip(t("you"));
  if (!mapData) {
    try { const r = await fetch("/api/public/sightings?days=14"); mapData = r.ok ? await r.json() : []; } catch { mapData = []; }
  }
  drawMap();
}
function drawMap() {
  if (!layer || !mapData) return;
  layer.clearLayers();
  const list = mapData.filter(s => mapFilter === "all" || s.animal === mapFilter);
  list.forEach(s => {
    const a = ANIMALS[s.animal] || ANIMALS.other;
    L.circleMarker([s.lat, s.lng], { radius: 9, color: "#fff", weight: 2, fillColor: a.deep, fillOpacity: .9 })
      .bindPopup("<b>" + esc(aName(s.animal)) + "</b><br>" + esc(incName(s.incident)) + "<br>" + esc(s.day)).addTo(layer);
  });
  $("mapCount").textContent = list.length === 1 ? t("shown_one") : t("shown", { n: list.length });
}

/* ---------- Tips ---------- */
let tipAnimal = "monkey";
function renderTips(k) {
  tipAnimal = k;
  const tabs = $("tipTabs");
  if (!tabs.children.length) {
    for (const key of Object.keys(ANIMALS)) {
      const b = document.createElement("button"); b.className = "chip"; b.dataset.k = key;
      b.innerHTML = '<i style="background:' + ANIMALS[key].deep + '"></i>' + esc(aName(key));
      b.onclick = () => { renderTips(key); restagger($("s-tips")); };
      tabs.appendChild(b);
    }
  }
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  const a = ANIMALS[k], tx = ANIMAL_TEXT[lang][k];
  $("tipHero").style.background = a.bg;
  $("tipName").textContent = tx.name; $("tipWho").textContent = tx.who;
  $("tipList").innerHTML = (TIPS[lang][k] || []).map((tip, i) => '<div class="tip-row" style="--i:' + i + '"><span class="n" style="background:' + a.bg + '">' + (i + 1) + '</span><span style="font-size:15px;line-height:1.45">' + esc(tip) + "</span></div>").join("");
}

/* ---------- Install as an app (PWA) ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// Running as the installed app (phone icon or desktop app window)?
const standalone = ["standalone", "fullscreen", "minimal-ui", "window-controls-overlay"]
  .some(m => matchMedia("(display-mode: " + m + ")").matches) || navigator.standalone === true;
if (standalone) store.set("ww_installed", true);           // remember it for the browser tab too
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const hideInstall = () => $("installBar").classList.add("hidden");
const installBlocked = () => standalone || store.get("ww_installed", false) || store.get("ww_install_off", false);
function setInstallHint() { $("installHint").textContent = t(isIOS ? "install_ios" : "install_hint"); }
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {        // Android and desktop Chrome / Edge
  e.preventDefault(); deferredPrompt = e;
  if (!installBlocked()) { setInstallHint(); $("installBar").classList.remove("hidden"); }
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const choice = await deferredPrompt.userChoice; deferredPrompt = null;
  if (choice && choice.outcome === "accepted") store.set("ww_installed", true);
  hideInstall();
};
$("installClose").onclick = () => { hideInstall(); store.set("ww_install_off", true); };
window.addEventListener("appinstalled", () => { store.set("ww_installed", true); hideInstall(); });
// Chrome can also tell us if this app is already installed on the device.
if (navigator.getInstalledRelatedApps) {
  navigator.getInstalledRelatedApps().then(apps => { if (apps && apps.length) { store.set("ww_installed", true); hideInstall(); } }).catch(() => {});
}
if (isIOS && !installBlocked()) {
  // iPhone has no install button for websites: show the Safari steps instead.
  setInstallHint(); $("installBtn").classList.add("hidden"); $("installBar").classList.remove("hidden");
}

/* ---------- Start ---------- */
applyLang();
$("startBtn").onclick = () => { store.set("ww_seen", true); locate(); show("home", "in-up"); };
if (store.get("ww_loc", false)) locate(ok => { if (ok && current === "home") renderNear(); });
show(store.get("ww_seen", false) ? "home" : "welcome", "in-fade");
</script>
</body>
</html>
